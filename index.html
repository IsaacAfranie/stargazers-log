<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of starred software repositories.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Stargazers log</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Personal archive</p>
        <h1>Stargazers log</h1>
        <p class="intro">A small collection of repositories worth returning to.</p>
      </header>

      <section class="repository-section" aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span id="repository-count" class="repository-count" aria-live="polite"></span>
        </div>
        <p id="list-status" class="list-status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list"></ul>
      </section>
    </main>
  </body>
</html>
